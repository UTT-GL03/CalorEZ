# To be used with GreenIT Analysis CLI
- name: Consulter une recette
  url: http://localhost/
  actions:
    - name: Consulter les informations
      type: scroll
    - name: Accéder aux recettes
    - name: Choisir un article
      type: click
      element: #root > main > div > article:nth-child(2) > footer > a
      pageChange: true
      waitForSelector: article > p
    - name: Lire la recette
      type: scroll
    - name: Ouvrir une recette
      type: click
      element: #root > main > div:nth-child(2) > a:nth-child(1)
      pageChange: true
      waitForSelector: .grid
    - name: Consulter la recette
      type: scroll
    - name: Retourner au menu principal
      type: click
      element: #root > nav > ul:nth-child(1) > li > strong > a
      pageChange: true
      waitForSelector: .grid

