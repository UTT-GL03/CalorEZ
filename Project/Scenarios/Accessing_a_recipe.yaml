# To be used with GreenIT Analysis CLI
- name: Consulter une recette
  url: http://localhost/
  waitForSelector: 'main article footer a[href="/recettes"]'
  actions:
    - name: Consulter les informations
      type: scroll
    - name: Accéder aux recettes
      type: click
      element: 'main article footer a[href="/recettes"]'
      pageChange: true
      waitForSelector: 'main a.tuile[href^="/recettes/"]'
    - name: Parcourir la liste des recettes
      type: press
      key: End
    - name: Ouvrir une recette
      type: click
      element: 'main a.tuile[href^="/recettes/"]'
      pageChange: true
      waitForSelector: 'main article ol'
    - name: Consulter la recette
      type: scroll
    - name: Retourner au menu principal
      type: click
      element: "#root > nav > ul:nth-child(1) > li > strong > a"
      pageChange: true
      waitForSelector: 'main article footer a[href="/recettes"]'

