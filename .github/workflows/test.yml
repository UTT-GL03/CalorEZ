name: Test
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        uses: actions/checkout@v5
      - name: Set up NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Project/frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd Project/frontend
          npm install
      - name: Build frontend
        run: |
          cd Project/frontend
          npm run build
      - name: Start frontend
        run: |
          docker compose up --detach
      - name: Verify frontend dataset
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused --max-time 5 \
            http://localhost/sample_data.json \
            --output "$RUNNER_TEMP/calorez-dataset.json"
          cmp Project/frontend/public/sample_data.json "$RUNNER_TEMP/calorez-dataset.json"

      - name: Download GreenIT Analysis CLI
        uses: actions/checkout@v5
        with:
          repository: cnumr/GreenIT-Analysis-cli
          ref: c4fec990458591d48871d9bd0668d79962d1a9a3
          path: greenit-cli

      - name: Run GreenIT Analysis CLI
        working-directory: greenit-cli
        run: |
          npm ci
          mkdir -p ../ecoindex-report
          node ./greenit analyse --format html --ci \
            ../Project/Scenarios/Accessing_a_recipe.yaml \
            ../ecoindex-report/report.html
          node -e 'if (!require("../ecoindex-report/json/1.json").success) throw new Error("EcoIndex scenario failed")'

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: EcoIndex
          path: ecoindex-report/*.html
          if-no-files-found: error
